[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudex"
version = "0.1.0"
description = "Subscription-aware failover between Claude Code and Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faisal Alalaiwat" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
claudex = "claudex.router:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
